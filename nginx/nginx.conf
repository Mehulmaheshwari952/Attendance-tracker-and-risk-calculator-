events {
    worker_connections 1024;
}

http {
    # Define the upstream load balancer group
    upstream fastapi_backend {
        # 'api' matches the service name in docker-compose
        # Docker's internal DNS will automatically resolve this to all running replicas
        server api:8000; 
    }

    server {
        listen 80;

        location / {
            proxy_pass http://fastapi_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_addrs_variable;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}